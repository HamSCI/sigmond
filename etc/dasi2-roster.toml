# etc/dasi2-roster.toml
#
# The DASI2 fleet.  A host whose name matches DASI\d{3} is a funded site if and
# only if it appears here — an unrostered DASI name is REFUSED rather than
# guessed, because guessing either way is silently wrong.
#
# Shipped in the repo deliberately: a field install has no network when it
# needs this.
#
# ⚠⚠⚠ PLACEHOLDER VALUES — DO NOT SHIP TO A REAL FLEET ⚠⚠⚠
# psws_station / psws_instrument below are PLACEHOLDERS in the correct shape
# only (S0002NN / I0002NN). Michael pre-defines the real PSWS Station and
# Instrument IDs for each DASI2 machine; they are not supplied yet. Replace
# every value in this file with the real pre-defined IDs before any fleet
# build.
#
# The [_meta] table below is how a PROGRAM tells: `load_roster()` warns loudly
# on it, because the values sit in the same S0002NN namespace as this project's
# real IDs and have no distinguishing shape.  Underscore-prefixed tables are never stations.  DELETE the whole
# [_meta] block in the same commit that lands the real IDs.

[_meta]
placeholder = true

[DASI001]
psws_station = "S000201"
psws_instrument = "I000201"

[DASI002]
psws_station = "S000202"
psws_instrument = "I000202"

