# /etc/tmpfiles.d/sigmond-snapshot.conf
#
# station-web snapshots.  sigmond-snapshot.service (root) writes
# /run/sigmond/snapshot/<name>.json, 0640; station-web's user belongs to
# sigmond-status and reads them.  station-web asks for a fresh check
# snapshot by creating an empty file in snapshot-request/, which setgid
# (2770) keeps in the sigmond-status group.  install.sh creates the group
# before applying this file; /run is empty at every boot, and
# systemd-tmpfiles-setup recreates both directories then.
#
# Type Path                           Mode UID  GID            Age Argument
d      /run/sigmond/snapshot          0750 root sigmond-status -
d      /run/sigmond/snapshot-request  2770 root sigmond-status -
