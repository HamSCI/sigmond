# etc/dasi2-roster.toml
#
# The DASI2 fleet.  A host whose name matches DASI\d{3} is a funded site if and
# only if it appears here — an unrostered DASI name is REFUSED rather than
# guessed, because guessing either way is silently wrong: called DASI2 it gets
# the wrong registrar and no PSWS ids, called ordinary it runs forever under a
# fleet name it does not own.
#
# Shipped in the repo deliberately: a field install has no network when it
# needs this.
#
# ── The list is CLOSED, and short on purpose ────────────────────────────────
# Only the stations whose PSWS ids Michael has actually defined appear here.
# DASI001 and DASI006+ are absent because we have no ids for them, so a machine
# carrying one of those names is refused until someone adds the entry.  That
# refusal is the point; do not pad this file to twenty rows.
#
# ── Two instruments per station ─────────────────────────────────────────────
# A DASI2 site reports a GRAPE/HF instrument AND a magnetometer instrument
# under ONE station id.  `psws_instruments` is keyed by the recorder that owns
# each one, which is the same shape `sigmond.site_profile` already uses
# (`instrument_for(recorder)`), so there is one model of PSWS identity in this
# codebase rather than two that disagree.
#
# ── No grid here, deliberately ──────────────────────────────────────────────
# PSWS requires a grid at REGISTRATION, but that value is provisional: the
# LBE-1421 (or whatever GPS unit the station carries) overwrites it on
# deployment, and `sigmond-location-check` re-asserts the GPSDO position as
# definitive from then on.  A grid in this file would be a stale fact waiting
# to be believed — the registration grid for these four is FN21ok only because
# that is where they are staged, not where they will operate.

[DASI002]
psws_station = "S000422"
psws_instruments = { "hf-timestd" = "370", "mag-recorder" = "371" }

[DASI003]
psws_station = "S000468"
psws_instruments = { "hf-timestd" = "380", "mag-recorder" = "381" }

[DASI004]
psws_station = "S000469"
psws_instruments = { "hf-timestd" = "382", "mag-recorder" = "383" }

[DASI005]
psws_station = "S000470"
psws_instruments = { "hf-timestd" = "384", "mag-recorder" = "385" }
