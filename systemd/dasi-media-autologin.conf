# getty@tty1 drop-in — dasi2 USB INSTALLATION MEDIA ONLY.
# Installed at image-build time as
#   /etc/systemd/system/getty@tty1.service.d/dasi-media-autologin.conf
# so the console logs hamsci straight in and the profile.d hook can offer
# the auto-install.  dasi-install removes the whole drop-in directory from
# installed targets, so a normal system never auto-logs-in.
# NOTE: this is a getty OVERRIDE, deliberately not a separate unit — a
# Conflicts=getty@tty1 unit wedges the installed system's boot (2026-07-25).
[Service]
ExecStart=
ExecStart=-/sbin/agetty --autologin hamsci --noclear %I $TERM
