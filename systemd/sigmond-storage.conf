# /etc/tmpfiles.d/sigmond-storage.conf
#
# The storage ledger (sigmond-storage.service, root) keeps its lock and its
# status file in /run/sigmond: storage.lock and storage-status.json (0644,
# read by `smd storage status` without root).  The tick refuses a directory
# that is not root's or that a group or other may write, so /run/sigmond
# stays root:root 0755.  /run is empty at every boot; systemd-tmpfiles-setup
# recreates it then.  The ledger creates its state directory,
# /var/lib/sigmond/storage, itself (root:root 0755).
#
# /var/lib/sigmond/tmp holds sigmond's own leftovers; the ledger's clean-up
# deletes old files there as root, and refuses to unless the directory is
# root's and no group or other may write it.  So it stays root:root 0755.
#
# Type Path            Mode UID  GID  Age Argument
d      /run/sigmond    0755 root root -
d      /var/lib/sigmond/tmp 0755 root root -
