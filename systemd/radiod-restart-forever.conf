# sigmond drop-in for radiod@.service — survive an absent SDR.
#
# Stock radiod carries Restart=always with the default StartLimitBurst=5 and a
# sub-second RestartSec.  When the RX-888 leaves the USB bus, radiod exits
# immediately and burns all five restarts inside about half a second, then
# lands in `failed` and stays there — so the card can come back and nothing
# notices.  Observed on AC0G-B4 2026-08-29.
#
# Disabling the rate limit turns that into a patient retry: radiod keeps
# trying every 10 s and simply succeeds when the card returns.  It also removes
# the need for a udev rule to start radiod on re-plug, and the need for any
# recovery path to call `systemctl reset-failed` first.
#
# The cost is a log line every 10 s while the SDR is genuinely gone.  That is
# the correct noise: a station without its receiver should say so continuously.
[Unit]
StartLimitIntervalSec=0

[Service]
RestartSec=10
