# /etc/tmpfiles.d/sigmond-heartbeat.conf
#
# Fleet heartbeat spool. `smd admin heartbeat emit` (run as root via
# sigmond-heartbeat.service) writes ticks here; the hs-uploader daemon
# (user hsupload, group hsupload) must be able to unlink acked files —
# hence group hsupload + setgid (2775), not sigmond's usual root:sigmond.
#
# sigmond has no prior tmpfiles.d convention (install.sh creates
# /var/lib/sigmond/* directories inline instead — see the `install -d`
# calls there) but that pattern doesn't fit here: the hsupload group is
# created by hs-uploader's OWN install.sh, which is catalog-installed and
# may not have run yet when sigmond's top-level install.sh runs. A
# systemd-tmpfiles entry is re-applied at every boot regardless of
# install order, so the directory self-heals to the right ownership once
# both sigmond and hs-uploader are present, instead of failing once at
# whichever install happened to run first.
#
# Type Path                          Mode UID  GID       Age Argument
d      /var/lib/sigmond/heartbeat     2775 root hsupload  -
