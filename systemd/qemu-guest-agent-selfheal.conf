# sigmond drop-in for qemu-guest-agent.service — installed by install.sh
# into /etc/systemd/system/qemu-guest-agent.service.d/ on VM guests.
#
# Why: qemu-ga buffers the entire output of a `qm guest exec` in memory.
# A large-output exec (observed: a journalctl sweep on AC0G-B4,
# 2026-08-24) balloons it to gigabytes; when the qm client times out,
# the agent is left wedged mid-write on the virtio port — process alive,
# channel dead, `qm agent ping` failing while systemd still shows
# active (running).  Restart=always never fires because nothing died.
#
# The fix is to make the failure fatal instead of silent: cap the
# agent's memory so a runaway exec buffer OOM-kills it, and systemd's
# stock Restart=always brings it back clean in seconds.  Normal
# footprint is ~16 MB; wizard config pushes are far below the cap.
#
# pm-heartbeat's guest-exec doctor check (guest-agent-wedged → INVALID
# on the fleetboard) remains the alarm for anything this doesn't catch.
[Service]
MemoryMax=128M
