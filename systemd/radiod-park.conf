[Unit]
# Managed by sigmond install.sh — every radiod instance pulls its thread
# parker companion on every start.  See sigmond-radiod-park@.service.
Wants=sigmond-radiod-park@%i.service
# ⛔ AND the timer, which is what actually keeps the fence clean.  The oneshot
# above is ordered After=radiod@%i.service, so it runs a fraction of a second
# after radiod starts — before radiod has created ANY demodulator threads.  On
# AI6VN those appeared 51 to 69 seconds later, inherited the whole fence pair
# as their mask, and the scheduler put several on the fft core; rob spotted it
# as a core at 57% while the fft thread itself was at 52% (2026-09-29).
# radiod also creates and destroys channel threads at runtime, so no one-shot
# can be sufficient.  The timer re-parks on a cadence.
Wants=sigmond-radiod-park@%i.timer
